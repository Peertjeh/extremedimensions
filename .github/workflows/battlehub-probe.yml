name: battlehub-probe
on:
  push:
    paths:
      - '.github/probe/**'
      - '.github/workflows/battlehub-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: battlehub
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: compile (downloads Minecraft)
        run: chmod +x ./gradlew && ./gradlew compileJava --stacktrace
      - name: probe
        run: bash ../.github/probe/battlehub-probe.sh
