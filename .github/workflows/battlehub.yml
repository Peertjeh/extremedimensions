name: battlehub
on:
  push:
    paths:
      - 'battlehub/**'
      - '.github/battlehub/**'
      - '.github/workflows/battlehub.yml'
  pull_request:
    paths:
      - 'battlehub/**'
      - '.github/battlehub/**'
      - '.github/workflows/battlehub.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: battlehub
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: build and test
        run: chmod +x ./gradlew && ./gradlew build --stacktrace
      - name: TEMP probe
        if: always() && hashFiles('.github/battlehub/probe.sh') != ''
        run: bash ../.github/battlehub/probe.sh
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BattleHub
          path: battlehub/build/libs/
      - name: boot a server with the mod and run the self-test
        run: bash ../.github/battlehub/server-test.sh
        timeout-minutes: 25
        env:
          SELFTEST: '1'
