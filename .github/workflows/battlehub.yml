name: battlehub
on:
  push:
    paths:
      - 'battlehub/**'
      - '.github/battlehub/**'
      - '.github/workflows/battlehub.yml'
  pull_request:
    paths:
      - 'battlehub/**'
      - '.github/battlehub/**'
      - '.github/workflows/battlehub.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: battlehub
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: build and test
        run: chmod +x ./gradlew && ./gradlew build --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BattleHub
          path: battlehub/build/libs/
      - name: TEMP probe APIs
        if: always()
        run: |
          bash ../.github/battlehub/probe.sh probe.txt
          mkdir -p probe && split -l 1500 -d -a 2 probe.txt probe/part-
          ls probe
      - name: TEMP upload probe
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe
          path: battlehub/probe/

  show:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        part: ['00','01','02','03']
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: probe
          path: probe
      - name: print part
        run: cat probe/part-${{ matrix.part }} 2>/dev/null || echo "no part"
