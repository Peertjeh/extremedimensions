name: battlehub
on:
  push:
    paths:
      - 'battlehub/**'
      - '.github/battlehub/**'
      - '.github/workflows/battlehub.yml'
  pull_request:
    paths:
      - 'battlehub/**'
      - '.github/battlehub/**'
      - '.github/workflows/battlehub.yml'
  workflow_dispatch:

jobs:
  ml:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: battlehub/ml
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: simulation tests (physics, spec, golden file)
        run: pip install numpy gymnasium pytest && python -m pytest -q tests
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: battlehub
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
      - name: build and test
        run: chmod +x ./gradlew && ./gradlew build --stacktrace
      # The Text Placeholder API stand-ins are only for compiling: the jar must not ship them
      - name: check the mod jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          if unzip -l "$jar" | grep -q "eu/pb4/"; then echo "Text Placeholder API stand-ins in $jar"; exit 1; fi
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BattleHub
          path: battlehub/build/libs/
      - name: boot a server with the mod and run the self-test
        run: bash ../.github/battlehub/server-test.sh
        timeout-minutes: 33
        env:
          SELFTEST: '1'
          SELFTEST_TIMEOUT: '1680'
      - name: keep the server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-log
          path: /tmp/srv/out.log
          if-no-files-found: ignore
