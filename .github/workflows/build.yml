name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    name: build and server tests
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Building also runs the server game tests on a headless dedicated server; a failing test fails the build
      - name: build and server game tests
        run: ./gradlew build
        timeout-minutes: 20
      # The Mod Menu stand-ins are only for compiling: the jar must not ship them
      - name: check the mod jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v sources | head -1)
          if unzip -l "$jar" | grep -q "com/terraformersmc/"; then echo "Mod Menu stand-ins in $jar"; exit 1; fi
          unzip -l "$jar" | grep -q "assets/extremedimensions/lang/nl_nl.json" || { echo "nl_nl.json missing from $jar"; exit 1; }
      # Development aid: a commit message with [probe] prints the signatures of the classes in tools/probe.txt (and
      # finds classes by the patterns after a # in that file) from the game jar the build used
      - name: api probe
        if: always() && contains(github.event.head_commit.message, '[probe]')
        run: |
          jar=$(find ~/.gradle/caches .gradle -name "*.jar" 2>/dev/null | grep -i minecraft | grep -iv -e sources -e intermediary -e fabric-api -e loader | xargs ls -S 2>/dev/null | head -1)
          echo "API|jar $jar"
          grep -v '^#' tools/probe.txt | while read -r c; do [ -n "$c" ] && javap -cp "$jar" -p "$c" 2>&1 | sed "s/^/API|/"; done
          unzip -l "$jar" | awk '{print $4}' | grep -E "$(grep '^#' tools/probe.txt | sed 's/^#//' | paste -sd'|')" | sed "s/^/APICLASS|/" | head -200
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  client:
    name: client test and screenshots
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-vulkan-drivers libegl1
      - name: client game test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --no-configuration-cache
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        timeout-minutes: 25
      - name: capture screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Screenshots
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: warn
      # For reviewing from where artifacts cannot be downloaded: a commit message with [shots] prints the screenshots
      # into the log as small JPEGs (base64, one IMG| line per chunk)
      - name: screenshots in the log
        if: always() && contains(github.event.head_commit.message, '[shots]')
        run: |
          python3 -m pip install -q --break-system-packages pillow >/dev/null 2>&1 || pip install -q pillow
          python3 - <<'PY'
          import glob, base64, io, os
          from PIL import Image
          for f in sorted(glob.glob("build/run/clientGameTest/screenshots/*.png")):
              im = Image.open(f).convert("RGB")
              im.thumbnail((800, 450))
              b = io.BytesIO(); im.save(b, "JPEG", quality=72)
              s = base64.b64encode(b.getvalue()).decode()
              for i in range(0, len(s), 3000):
                  print(f"IMG|{os.path.basename(f)}|{i//3000}|{s[i:i+3000]}")
          PY
