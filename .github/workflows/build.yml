name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: debug minecraft api
        if: always()
        run: |
          J=$(find ~/.gradle/caches -name '*.jar' -path '*minecraft*' | grep -i -E 'client|merged' | grep -v sources | head -5)
          echo "$J"
          for j in $J; do
            javap -cp "$j" -public net.minecraft.client.Minecraft 2>/dev/null | grep -i -E 'screen|gui' && break
          done
          for j in $J; do
            javap -cp "$j" -public net.minecraft.client.gui.Gui 2>/dev/null | grep -i screen && break
          done
          for j in $J; do
            javap -cp "$j" -public net.minecraft.client.gui.screens.Screen 2>/dev/null | grep -i -E 'close|screen' && break
          done
