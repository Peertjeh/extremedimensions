plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// The learned combat model (battlehub/ml) runs with ONNX Runtime, shipped inside the mod jar
	implementation "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"
	include "com.microsoft.onnxruntime:onnxruntime:${project.onnxruntime_version}"

	// Pure game logic (net.battlehub.core) is tested without Minecraft on the classpath at runtime.
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
	runs {
		server {
			// Server-side only mod: the dev server is the main test target.
			runDir "run"
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
	// one spec for the simulation and the mod: ml/spec is the source
	from("ml/spec") {
		include "combat_v3.json", "combat_v3_ranges.json", "combat_v3_masks.json", "lessons.json"
		into "assets/battlehub/ml"
	}
}

sourceSets {
	test {
		// the golden file the simulation writes, checked by CombatObservationTest
		resources.srcDir "ml/spec"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
	exclude "eu/pb4/**"
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// Compile-time stand-ins for Text Placeholder API's classes: placeholder-api brings the real ones when installed
	exclude "eu/pb4/**"

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
