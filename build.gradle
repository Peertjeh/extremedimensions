plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Modrinth's maven, for the plugin APIs of JEI, Jade, WTHIT and JourneyMap alone (compile only: each brings itself
	// when a player has it installed)
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"extremedimensions" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// JourneyMap keeps its plugin API in a jar inside its own: the outer jar is fetched only for that inner one to be taken
// out, which alone goes on the client's compile classpath (nothing of JourneyMap is shipped or needed to run)
configurations {
	journeymapBundle {
		transitive = false
	}
	// Xaero's Minimap's own jar holds its library (xaerolib) inside it, which some of its types come from
	xaeroBundle {
		transitive = false
	}
}
interface ArchiveTools {
	@javax.inject.Inject
	ArchiveOperations getArchives()
}
def archiveTools = objects.newInstance(ArchiveTools)
// (a name of its own: one the same as the configuration's would be taken for it in the dependencies block below)
def journeymapJars = configurations.journeymapBundle
def journeymapApi = tasks.register("journeymapApi", Sync) {
	description = "Takes JourneyMap's plugin API out of its jar, for the client's map plugin to compile against"
	from(journeymapJars.elements.map { jars -> jars.collect { archiveTools.archives.zipTree(it.asFile) } }) {
		include "META-INF/jars/journeymap-api-*.jar"
		eachFile { it.path = "journeymap-api.jar" }
	}
	includeEmptyDirs = false
	into layout.buildDirectory.dir("journeymap-api")
}

def xaeroJars = configurations.xaeroBundle
def xaeroLib = tasks.register("xaeroLib", Sync) {
	description = "Takes Xaero's library out of Xaero's Minimap's jar, for the client's waypoints to compile against"
	from(xaeroJars.elements.map { jars -> jars.collect { archiveTools.archives.zipTree(it.asFile) } }) {
		include "META-INF/jars/xaerolib-*.jar"
		eachFile { it.path = "xaerolib.jar" }
	}
	includeEmptyDirs = false
	into layout.buildDirectory.dir("xaerolib")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI (31.14.0.72 for 26.3, Modrinth version Zebwcvua): the client's plugin compiles against it; it is never
	// shipped or needed (the plugin is only loaded by JEI itself, through the jei_mod_plugin entrypoint)
	clientCompileOnly "maven.modrinth:jei:Zebwcvua"

	// Jade (26.3.5 for 26.3, Modrinth version 71CTWqdE) and WTHIT (21.0.0, Modrinth version GZ97QWSj): the client's
	// tooltip plugins compile against them; neither is shipped or needed (Jade loads its plugin through the jade
	// entrypoint, WTHIT through waila_plugins.json)
	clientCompileOnly "maven.modrinth:jade:71CTWqdE"
	clientCompileOnly "maven.modrinth:wthit:GZ97QWSj"

	// JourneyMap (26.3-6.0.10, Modrinth version 2zmj8ela), for its plugin API 2.0.0 (see journeymapApi above): the map
	// plugin is only loaded by JourneyMap itself, through the journeymap entrypoint
	journeymapBundle "maven.modrinth:journeymap:2zmj8ela"
	clientCompileOnly files(layout.buildDirectory.file("journeymap-api/journeymap-api.jar")).builtBy(journeymapApi)

	// Xaero's Minimap (26.6.2 for 26.3, Modrinth version MfxfgXaO), and the library inside it: the client's waypoints
	// compile against them; neither is shipped or needed (they are handed over only where Xaero's Minimap is loaded)
	xaeroBundle "maven.modrinth:xaeros-minimap:MfxfgXaO"
	clientCompileOnly "maven.modrinth:xaeros-minimap:MfxfgXaO"
	clientCompileOnly files(layout.buildDirectory.file("xaerolib/xaerolib.jar")).builtBy(xaeroLib)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
	exclude "com/terraformersmc/**", "eu/pb4/**"
	// The music and the pictures are no source to read and would double its size: they live in the mod's own jar
	exclude "**/*.ogg", "**/*.png"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// Compile-time stand-ins for Mod Menu's and Text Placeholder API's: those mods bring the real ones when installed
	exclude "com/terraformersmc/**", "eu/pb4/**"

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Every language file must fit the English one: no unknown keys and the same placeholders in every string. Languages
// shipped with the mod must also be complete; a community translation may lag behind (the game shows English there).
def langDir = layout.projectDirectory.dir("src/client/resources/assets/extremedimensions/lang")
tasks.register("checkTranslations") {
	description = "Checks every language file against en_us.json"
	group = "verification"
	def dir = langDir.asFile
	inputs.dir(dir)
	def complete = ["nl_nl.json"]
	doLast {
		def slurp = { File f -> new groovy.json.JsonSlurper().parse(f, "UTF-8") }
		def en = slurp(new File(dir, "en_us.json"))
		def holes = { String v ->
			def found = []
			def m = java.util.regex.Pattern.compile('%(\\d+\\$)?[sd]|%%').matcher(v)
			while (m.find()) {
				found << m.group()
			}
			found.sort()
		}
		def problems = []
		dir.listFiles().findAll { it.name.endsWith(".json") && it.name != "en_us.json" }.sort { it.name }.each { File f ->
			def lang = slurp(f)
			def missing = en.keySet() - lang.keySet()
			if (missing && complete.contains(f.name)) {
				problems << "${f.name}: ${missing.size()} key(s) missing: ${missing.take(10)}"
			} else if (missing) {
				logger.warn("${f.name}: ${missing.size()} key(s) not translated yet (English is shown)")
			}
			(lang.keySet() - en.keySet()).each { problems << "${f.name}: unknown key ${it}" }
			lang.each { k, v ->
				if (en.containsKey(k) && holes(en[k].toString()) != holes(v.toString())) {
					problems << "${f.name}: ${k} has placeholders ${holes(v.toString())}, English has ${holes(en[k].toString())}"
				}
			}
		}
		if (problems) {
			throw new GradleException("Translation problems:\n" + problems.join("\n"))
		}
	}
}
tasks.named("check") {
	dependsOn("checkTranslations")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Game tests: server tests on a headless dedicated server (./gradlew runGameTest) and a client test in a real
// window (./gradlew runClientGameTest). Both run in CI on every push; sources live in src/gametest.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "extremedimensions-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// The compatibility job (CI, -Pcompat): the client test runs with the newest Sodium, Iris, Mod Menu and Text Placeholder
// API for this game version (fetched into build/compat-mods by tools/compat/fetch.py), ClientCompat alone takes its turn,
// and the stand-ins are left out of the classes it runs, so the real mods' APIs are the ones loaded.
if (project.hasProperty("compat")) {
	def compatMods = layout.buildDirectory.dir("compat-mods").get().asFile
	loom.runs.matching { it.name == "clientGameTest" }.configureEach {
		vmArg "-Dextremedimensions.compat=true"
		vmArg "-Dfabric.addMods=${compatMods}"
	}
	// (after everything is compiled against them, before the game starts)
	def compatShaders = layout.buildDirectory.dir("compat-shaders").get().asFile
	tasks.matching { it.name == "runClientGameTest" }.configureEach {
		doFirst {
			delete fileTree(sourceSets.client.java.destinationDirectory) { include "com/terraformersmc/**" }
			delete fileTree(sourceSets.main.java.destinationDirectory) { include "eu/pb4/**" }
			// The shader pack the job fetched (3.51.1), in the game folder once it has been cleared, selected for Iris
			// but left off (the test turns it on at the end)
			def pack = compatShaders.exists() ? compatShaders.listFiles()?.find { it.isFile() } : null
			if (pack != null) {
				def gameDir = layout.buildDirectory.dir("run/clientGameTest").get().asFile
				copy {
					from pack
					into new File(gameDir, "shaderpacks")
				}
				def config = new File(gameDir, "config")
				config.mkdirs()
				new File(config, "iris.properties").text = "shaderPack=${pack.name}\nenableShaders=false\n"
				println "Shader pack for the test: ${pack.name}"
			}
		}
	}
}

// The benchmark (CI, tools/bench/run.py): a little mod of its own, built apart from Extreme Dimensions and never shipped,
// that takes a real dedicated server through the same play with and without the mod and writes what it measured. It
// compiles against the game and Fabric API only, so it runs on a server without the mod as well.
sourceSets {
	bench {
		compileClasspath += sourceSets.main.compileClasspath
	}
}
tasks.register("benchJar", Jar) {
	description = "Builds the benchmark mod into build/bench (see tools/bench)"
	group = "build"
	from sourceSets.bench.output
	archiveFileName = "extremedimensions-bench.jar"
	destinationDirectory = layout.buildDirectory.dir("bench")
}
