plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"extremedimensions" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("sourcesJar") {
	exclude "com/terraformersmc/**"
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	// Compile-time stand-ins for Mod Menu's API: Mod Menu brings the real ones when installed
	exclude "com/terraformersmc/**"

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Every language file must fit the English one: no unknown keys and the same placeholders in every string. Languages
// shipped with the mod must also be complete; a community translation may lag behind (the game shows English there).
def langDir = layout.projectDirectory.dir("src/client/resources/assets/extremedimensions/lang")
tasks.register("checkTranslations") {
	description = "Checks every language file against en_us.json"
	group = "verification"
	def dir = langDir.asFile
	inputs.dir(dir)
	def complete = ["nl_nl.json"]
	doLast {
		def slurp = { File f -> new groovy.json.JsonSlurper().parse(f, "UTF-8") }
		def en = slurp(new File(dir, "en_us.json"))
		def holes = { String v ->
			def found = []
			def m = java.util.regex.Pattern.compile('%(\\d+\\$)?[sd]|%%').matcher(v)
			while (m.find()) {
				found << m.group()
			}
			found.sort()
		}
		def problems = []
		dir.listFiles().findAll { it.name.endsWith(".json") && it.name != "en_us.json" }.sort { it.name }.each { File f ->
			def lang = slurp(f)
			def missing = en.keySet() - lang.keySet()
			if (missing && complete.contains(f.name)) {
				problems << "${f.name}: ${missing.size()} key(s) missing: ${missing.take(10)}"
			} else if (missing) {
				logger.warn("${f.name}: ${missing.size()} key(s) not translated yet (English is shown)")
			}
			(lang.keySet() - en.keySet()).each { problems << "${f.name}: unknown key ${it}" }
			lang.each { k, v ->
				if (en.containsKey(k) && holes(en[k].toString()) != holes(v.toString())) {
					problems << "${f.name}: ${k} has placeholders ${holes(v.toString())}, English has ${holes(en[k].toString())}"
				}
			}
		}
		if (problems) {
			throw new GradleException("Translation problems:\n" + problems.join("\n"))
		}
	}
}
tasks.named("check") {
	dependsOn("checkTranslations")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// Game tests: server tests on a headless dedicated server (./gradlew runGameTest) and a client test in a real
// window (./gradlew runClientGameTest). Both run in CI on every push; sources live in src/gametest.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "extremedimensions-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

// The compatibility job (CI, -Pcompat): the client test runs with the newest Sodium, Iris and Mod Menu for this game
// version (fetched into build/compat-mods by tools/compat/fetch.py), ClientCompat alone takes its turn, and the Mod Menu
// stand-ins are left out of the classes it runs, so the real Mod Menu's API is the one loaded.
if (project.hasProperty("compat")) {
	def compatMods = layout.buildDirectory.dir("compat-mods").get().asFile
	loom.runs.matching { it.name == "clientGameTest" }.configureEach {
		vmArg "-Dextremedimensions.compat=true"
		vmArg "-Dfabric.addMods=${compatMods}"
	}
	// (after everything is compiled against them, before the game starts)
	tasks.matching { it.name == "runClientGameTest" }.configureEach {
		doFirst {
			delete fileTree(sourceSets.client.java.destinationDirectory) { include "com/terraformersmc/**" }
		}
	}
}
