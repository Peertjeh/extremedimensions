# Animations, used in config.yml as %animation:<name>%.
# change-interval is the time per frame in milliseconds (a multiple of 50).
# https://github.com/NEZNAMY/TAB/wiki/Animations

# A slow color wave over the survival title, from Nether red to End purple.
# To stop it, replace %animation:title% in config.yml with a fixed title:
# "<#FF5A36>&lEXTREME DIMENSIONS</#B565F2>"
title:
