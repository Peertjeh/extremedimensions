# Player names in the player list: tabprefix, customtabname, tabsuffix.
# Groups come from LuckPerms if it is installed. Without LuckPerms nobody has
# a group and everyone uses _DEFAULT_.
# https://github.com/NEZNAMY/TAB/wiki/How-to-assign-players-into-groups

# Settings for everyone, unless a group below overrides them.
# The name comes from tab-name in config.yml: colored by dimension in
# survival (white Overworld, red Nether, purple End, aqua Seam), BattleHub's
# own name with title and clan in BattleHub, gray in spectator mode.
# Before it, in BattleHub, a dot for what the player is doing (tab-prefix in
# config.yml). The curse badge is at the right, next to the ping bars
# (playerlist-objective in config.yml).
_DEFAULT_:
  tabprefix: "%condition:tab-prefix%%luckperms-prefix%"
  customtabname: "%condition:tab-name%"
  tabsuffix: "%luckperms-suffix%"

# Example for a LuckPerms group named admin:
# admin:
#   tabprefix: "&c[Admin] "
