# Player names in the player list (tabprefix, customtabname, tabsuffix)
# and above heads (tagprefix, tagsuffix).
# Groups come from LuckPerms if it is installed. Without LuckPerms nobody has
# a group and everyone uses _DEFAULT_.
# https://github.com/NEZNAMY/TAB/wiki/How-to-assign-players-into-groups

# Settings for everyone, unless a group below overrides them.
# Names are colored by where the player is (see name-color in config.yml):
# white in the Overworld and battlehub, red in the Nether, purple in the End,
# aqua in the Seam, gray italic in spectator mode.
_DEFAULT_:
  tabprefix: "%luckperms-prefix%"
  customtabname: "%condition:name-color%%player%"
  tabsuffix: "%luckperms-suffix%"
  tagprefix: "%luckperms-prefix%"
  tagsuffix: "%luckperms-suffix%"

# Example for a LuckPerms group named admin:
# admin:
#   tabprefix: "&c[Admin] "
#   tagprefix: "&c[Admin] "
