# =====================================================================
#  TAB 6.2.1 - Extreme Dimensions server (Fabric, single server, no proxy)
#  Location on the server: config/tab/config.yml
#  After a change: /tab reload
#
#  Keep every option below, even the disabled ones: if one is missing,
#  TAB adds it back and rewrites the whole file, which strips all comments.
# =====================================================================

# Text above and below the player list. The first design whose
# display-condition matches is shown, so battlehub has to stay on top.
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Header-&-Footer
header-footer:
  enabled: true
  designs:
    battlehub:
      display-condition: battlehub
      header:
        - ""
        - "<#FFC933>&lBATTLEHUB</#FF3D3D>"
        - "&7Minigames"
        - ""
      footer:
        - ""
        - "&7In Battlehub: &f%worldonline%   &8|   &7Ping: &f%ping% ms"
        - ""
    survival:
      header:
        - ""
        - "<#FF5A36>&lEXTREME DIMENSIONS</#B565F2>"
        - "&7&oEvery portal is a wound."
        - ""
      footer:
        - ""
        - "&7Dimension: %condition:dimension%"
        - "&7Online: &f%online%   &8|   &7Ping: &f%ping% ms"
        - ""

# Separate player lists: players in battlehub only see battlehub players,
# everyone else only sees the survival players (all other dimensions).
# On Fabric this only works through layout, which always shows a fixed
# number of rows. Raise slot-count (and the slots range with it) if more
# players are online at once; extra players show as "... and X more".
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Layout
layout:
  enabled: true
  direction: COLUMNS
  default-skin: mineskin:37e93c8e12cd426cb28fce31969e0674
  enable-remaining-players-text: true
  remaining-players-text: "&7... and %s more"
  empty-slot-ping-value: 1000
  layouts:
    battlehub:
      display-condition: battlehub
      slot-count: 10
      fixed-slots: []
      groups:
        players:
          display-condition: battlehub
          slots:
            - "1-10"
    survival:
      slot-count: 10
      fixed-slots: []
      groups:
        players:
          display-condition: survival
          slots:
            - "1-10"

# Player names in the list (prefix/suffix from groups.yml, e.g. from LuckPerms)
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Tablist-name-formatting
tablist-name-formatting:
  enabled: true
  disable-condition: ""

# Nametags above players and the order in the list
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Nametags
scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false
  can-see-friendly-invisibles: false
  disable-condition: ""
  # Alphabetical. With LuckPerms you can put ranks on top by adding this
  # line above it: - "GROUPS:owner,admin,mod,default"
  # https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Sorting-players-in-tablist
  sorting-types:
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: false

# Off: the mod uses the boss bar itself for the Tether timer.
bossbar:
  enabled: false

# Not used. Playerlist objective can't be combined with layout anyway.
playerlist-objective:
  enabled: false
belowname-objective:
  enabled: false
scoreboard:
  enabled: false
prevent-spectator-effect:
  enabled: false
ping-spoof:
  enabled: false
per-world-playerlist:
  enabled: false # does not work on Fabric, layout above does this instead
global-playerlist:
  enabled: false # proxy networks only
  update-latency: false
proxy-support:
  enabled: false # proxy networks only
mysql:
  enabled: false

# On Fabric, TAB names worlds after level-name in server.properties plus a
# suffix, e.g. world, world_nether, world_the_end, world_the_seam. A world
# counts as battlehub when its name contains "battlehub". Check a player's
# world name with: /tab parse <player> %world%
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Conditional-placeholders
conditions:
  battlehub:
    conditions:
      - "%world%<-battlehub"
  survival:
    conditions:
      - "%world%!<-battlehub"
  # Dimension name for the survival footer
  dimension:
    conditions:
      - "%world%-|_nether"
    true: "&cNether"
    false: "%condition:dimension-end%"
  dimension-end:
    conditions:
      - "%world%-|_the_end"
    true: "&dThe End"
    false: "%condition:dimension-seam%"
  dimension-seam:
    conditions:
      - "%world%-|_the_seam"
    true: "&bThe Seam"
    false: "&aOverworld"

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "HH:mm"
  time-offset: 0
  register-tab-expansion: false
  locale: en-US

placeholder-refresh-intervals:
  default-refresh-interval: 500

components:
  minimessage-support: true
  disable-shadow-for-heads: true

# Groups come from LuckPerms if it is installed, otherwise players have no group.
assign-groups-by-permissions: false
primary-group-finding-list:
  - default
permission-refresh-interval: 1000

compensate-for-packetevents-bug: false
use-online-uuid-in-tablist: true
debug: false

# Internal value, do not change
config-version: 7
