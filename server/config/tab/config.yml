# =====================================================================
#  TAB 6.2.1 - Extreme Dimensions + Extreme Progression + BattleHub
#  (Fabric, single server)
#  Location on the server: config/tab/config.yml
#  After a change: /tab reload
#
#  Needs Text Placeholder API (placeholder-api) on the server: the
#  %extremedimensions:...%, %extremeprogression:...%, %battlehub:...% and
#  %player:...% placeholders come through it. Without it they show up as
#  plain text.
#  Needs BattleHub 1.52.0 or newer: it keeps the BattleHub and survival
#  player lists apart and leaves its Bot_ players out.
#
#  Keep every option below, even the disabled ones: if one is missing,
#  TAB adds it back and rewrites the whole file, which strips all comments.
# =====================================================================

# Text above and below the player list. The first design whose
# display-condition matches is shown, so battlehub has to stay on top.
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Header-&-Footer
header-footer:
  enabled: true
  designs:
    battlehub:
      display-condition: battlehub
      header: # \u2694 is the crossed swords symbol
        - ""
        - "&6\u2694 %animation:battlehub-title% &6\u2694"
        - "&7Pick a game. Play to win."
        - ""
      footer:
        - ""
        - "&7Level &f%battlehub:level%   &8|   &7ELO &f%battlehub:elo% %battlehub:tier%   &8|   &6%battlehub:coins% &7coins"
        - "&7In BattleHub: &f%battlehub:players%   &8|   &7In a match: &f%battlehub:in_matches%   &8|   &7Ping: &f%ping% ms"
        - "%condition:bh-today%%condition:bh-both%%condition:bh-weekly%"
        - ""
    survival:
      header:
        - ""
        - "%animation:title%"
        - "%extremedimensions:difficulty%   &8|   &7Tapestry &f%extremedimensions:tapestry%   &8|   %extremedimensions:ending%"
        - "&7Progression %extremeprogression:preset%   &8|   &7Synergies found &f%extremeprogression:discoveries%%condition:ep-xp-event%"
        - ""
      footer:
        - ""
        - "%extremedimensions:realm%   &8|   %extremedimensions:status% &f%extremedimensions:time_left%"
        - "&7Curses: %extremedimensions:curses%   &8|   &7Scars: &f%extremedimensions:scars%&7/5"
        - "&7Level &f%extremeprogression:total%&7/%extremeprogression:cap%   &8|   %condition:ep-highest%&7Death pressure %extremeprogression:pressure%%condition:ep-fatigue%%condition:ep-party%"
        - "&7Online: &f%online%   &8|   &7Ping: &f%ping% ms"
        - ""

# A column at the right of the list, next to the ping bars: Extreme
# Progression's level badge (\u2726 and the total level, a gold star with
# Mastery), then Extreme Dimensions' curse badge (a skull and the curses, a
# purple star with an Abyssal curse; a dim skull and 0 without curses, so the
# columns stay in line). The spaces in front make the list wider: add or
# remove some to change its width. Only in survival: in BattleHub there is
# no column.
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Playerlist-Objective
playerlist-objective:
  enabled: true
  value: "0" # never shown: the client shows fancy-value instead
  fancy-value: "            %extremeprogression:badge%   %condition:curse-badge%"
  title: "Level and curses"
  render-type: INTEGER
  disable-condition: battlehub

# Off: BattleHub (1.52+) keeps the BattleHub and survival lists apart and
# leaves its bots out itself. A layout would also hide the column above.
layout:
  enabled: false

# Player names in the list, set in groups.yml
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Tablist-name-formatting
tablist-name-formatting:
  enabled: true
  disable-condition: ""

# TAB's nametags stay off: BattleHub draws its own above heads (titles,
# CTF team colours, enemies' tags hidden in a match) and TAB would block
# those. The list is then in the game's own order, by name.
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Sorting-players-in-tablist
scoreboard-teams:
  enabled: false
  sorting-types:
    - "PLACEHOLDER_A_TO_Z:%player%"
  case-sensitive-sorting: false

# Off: the mod uses the boss bar itself for the Tether timer.
bossbar:
  enabled: false

# Not used.
belowname-objective:
  enabled: false
scoreboard:
  enabled: false
prevent-spectator-effect:
  enabled: false
ping-spoof:
  enabled: false
per-world-playerlist:
  enabled: false # does not work on Fabric, layout above does this instead
global-playerlist:
  enabled: false # proxy networks only
  update-latency: false
proxy-support:
  enabled: false # proxy networks only
mysql:
  enabled: false

# On Fabric, TAB names a world after level-name in server.properties plus
# the dimension's name without its namespace: world, world_nether,
# world_the_end, world_the_seam. BattleHub's lobby (battlehub:hub) becomes
# world_hub and its matches (battlehub:arenas) world_arenas.
# Check a player's world name with: /tab parse <player> %world%
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Conditional-placeholders
conditions:
  battlehub:
    conditions:
      - "%world%-|_hub"
      - "%world%-|_arenas"
    type: OR
  # The name in the player list (customtabname in groups.yml): gray in
  # spectator mode, BattleHub's own name in BattleHub (title, stars, clan,
  # name colour), and in survival colored by dimension.
  tab-name:
    conditions:
      - "%gamemode%=3"
    true: "&7&o%player%"
    false: "%condition:tab-name-battlehub%"
  tab-name-battlehub:
    conditions:
      - "%condition:battlehub%=true"
    true: "%player:displayname_visual%"
    false: "%condition:name-color%%player%"
  name-color:
    conditions:
      - "%world%-|_nether"
    true: "&c"
    false: "%condition:name-color-end%"
  name-color-end:
    conditions:
      - "%world%-|_the_end"
    true: "&d"
    false: "%condition:name-color-seam%"
  name-color-seam:
    conditions:
      - "%world%-|_the_seam"
    true: "&b"
    false: "&f"
  # The curse badge in the column at the right (playerlist-objective).
  curse-badge:
    conditions:
      - "%extremedimensions:badge%!="
    true: "%extremedimensions:badge%"
    false: "&8\u26200"
  # In the survival footer: the best skill when there is one, death fatigue
  # while it lasts, and in the header a running XP event.
  ep-highest:
    conditions:
      - "%extremeprogression:highest%!="
    true: "&7Best &f%extremeprogression:highest%   &8|   "
    false: ""
  ep-fatigue:
    conditions:
      - "%extremeprogression:fatigue%!="
    true: "   &8|   &cFatigue %extremeprogression:fatigue%"
    false: ""
  ep-xp-event:
    conditions:
      - "%extremeprogression:xp_event%!="
    true: "   &8|   &6XP %extremeprogression:xp_event%"
    false: ""
  # In the survival footer: the party you are in and the XP bonus it gives you
  # now (party members near who earn XP of their own).
  ep-party:
    conditions:
      - "%extremeprogression:party_size%!="
    true: "   &8|   &aParty %extremeprogression:party_size% &2%extremeprogression:party_bonus%"
    false: ""
  # In BattleHub a dot before the name (tabprefix in groups.yml) says what the
  # player is doing: green in the lobby, yellow in a queue, red in a match,
  # gray watching. \u25cf is the dot.
  tab-prefix:
    conditions:
      - "%condition:battlehub%=true"
    true: "%condition:activity-dot%"
    false: ""
  activity-dot:
    conditions:
      - "%battlehub:activity%=match"
    true: "&c\u25cf "
    false: "%condition:activity-dot-queue%"
  activity-dot-queue:
    conditions:
      - "%battlehub:activity%=queue"
    true: "&e\u25cf "
    false: "%condition:activity-dot-watching%"
  activity-dot-watching:
    conditions:
      - "%battlehub:activity%=spectating"
    true: "&7\u25cf "
    false: "&a\u25cf "
  # The BattleHub footer's last line: today's mode and the next weekly
  # tournament, each only when BattleHub has one.
  bh-today:
    conditions:
      - "%battlehub:mode_of_the_day%!="
    true: "&7Today: &e%battlehub:mode_of_the_day%"
    false: ""
  bh-weekly:
    conditions:
      - "%battlehub:weekly%!="
    true: "&7Weekly tournament: &e%battlehub:weekly%"
    false: ""
  bh-both:
    conditions:
      - "%battlehub:mode_of_the_day%!="
      - "%battlehub:weekly%!="
    type: AND
    true: "   &8|   "
    false: ""

# Colors for the mod's words in the header and footer. The colors of the
# dimensions match the name colors.
# https://github.com/NEZNAMY/TAB/wiki/Feature-guide:-Placeholder-output-replacements
placeholder-output-replacements:
  "%extremedimensions:realm%":
    "Overworld": "&fOverworld"
    "Nether": "&cNether"
    "End": "&dThe End"
    "Seam": "&bThe Seam"
    "Fray": "&3The Fray"
    "Elsewhere": "&7Elsewhere"
  "%extremedimensions:status%":
    "At home": "&aAt home"
    "On an expedition": "&6On an expedition"
    "In the Seam": "&bIn the Seam"
    "In the Fray": "&3In the Fray"
    "Unweaving": "&dUnweaving"
    "Fallen": "&cFallen"
    "Elsewhere": "&7Elsewhere"
  "%extremedimensions:curses%": # the footer; same steps as the badge
    "0": "&a0"
    "1-9": "&7%value%"
    "10-29": "&e%value%"
    "30-59": "&c%value%"
    "60-100000": "&4%value%"
  "%extremedimensions:difficulty%":
    "Easy": "&aEasy"
    "Normal": "&eNormal"
    "Hard": "&6Hard"
    "Extreme": "&cExtreme"
    "Custom": "&7Custom"
  "%extremedimensions:ending%":
    "Unended": "&7Unended"
    "Mended": "&aMended"
    "Severed": "&cSevered"
  "%extremeprogression:preset%":
    "Hardcore": "&cHardcore"
    "Normal": "&eNormal"
    "Custom": "&7Custom"
  "%extremeprogression:pressure%": # from 2 a death also takes a whole level
    "0": "&a0"
    "1": "&e1"
    "2-1000": "&c%value%"

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "HH:mm"
  time-offset: 0
  register-tab-expansion: false
  locale: en-US

# The mod works its values out once a second, so asking more often is wasted.
placeholder-refresh-intervals:
  default-refresh-interval: 500
  "%extremedimensions:badge%": 1000
  "%extremedimensions:realm%": 1000
  "%extremedimensions:status%": 1000
  "%extremedimensions:curses%": 1000
  "%extremedimensions:scars%": 1000
  "%extremedimensions:difficulty%": 1000
  "%extremedimensions:tapestry%": 1000
  "%extremedimensions:ending%": 1000
  "%player:displayname_visual%": 1000
  "%battlehub:activity%": 1000
  "%battlehub:level%": 1000
  "%battlehub:elo%": 1000
  "%battlehub:tier%": 1000
  "%battlehub:coins%": 1000
  "%battlehub:players%": 1000
  "%battlehub:in_matches%": 1000
  "%battlehub:mode_of_the_day%": 1000
  "%battlehub:weekly%": 1000
  "%extremeprogression:badge%": 1000
  "%extremeprogression:preset%": 1000
  "%extremeprogression:discoveries%": 1000
  "%extremeprogression:xp_event%": 1000
  "%extremeprogression:total%": 1000
  "%extremeprogression:cap%": 1000
  "%extremeprogression:highest%": 1000
  "%extremeprogression:pressure%": 1000
  "%extremeprogression:fatigue%": 1000
  "%extremeprogression:party_size%": 1000
  "%extremeprogression:party_bonus%": 1000

components:
  minimessage-support: true
  disable-shadow-for-heads: true

# Groups come from LuckPerms if it is installed, otherwise players have no group.
assign-groups-by-permissions: false
primary-group-finding-list:
  - default
permission-refresh-interval: 1000

compensate-for-packetevents-bug: false
use-online-uuid-in-tablist: true
debug: false

# Internal value, do not change
config-version: 7
